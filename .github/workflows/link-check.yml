name: Link check

# The page is mostly external links (Bandcamp, SoundCloud, Spotify); this catches rot.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1' # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every external URL in index.html
        run: |
          # Skipped: ra.co + instagram.com (bot-blocked: 403 / login wall),
          # fonts.gstatic.com (preconnect origin only, 404 on /),
          # w.soundcloud.com (player base URL inside JS, not a content link),
          # schema.org (JSON-LD @context).
          skip='ra\.co|instagram\.com|fonts\.gstatic\.com|w\.soundcloud\.com|schema\.org'
          : > broken.txt
          for u in $(grep -oE 'https://[^"'"'"' <)]+' index.html | sort -u | grep -Ev "$skip"); do
            # "|| true": connection-level failures must not abort the step (bash -e)
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 --retry 2 \
                   -A 'Mozilla/5.0 (dodi-epk link check)' "$u" || true)
            [ -n "$code" ] || code=000
            # 403/429 = bot-gating of datacenter IPs (SoundCloud etc.), not rot.
            # Real rot shows as 404/410/5xx/000.
            case "$code" in
              2*|403|429) echo "ok   $code  $u" ;;
              *)          echo "FAIL $code  $u" | tee -a broken.txt
                          echo "::error title=Broken link::$code $u" ;;
            esac
          done
          [ ! -s broken.txt ]

      - name: Open an issue (weekly runs only)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --state open --search 'Link rot on dodi.fm in:title' --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "Open link-rot issue already exists; not filing another."
            exit 0
          fi
          { echo 'The weekly link check found dead links on the EPK:'
            echo
            sed 's/^/- /' broken.txt
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > body.md
          gh issue create --title 'Link rot on dodi.fm' --body-file body.md
